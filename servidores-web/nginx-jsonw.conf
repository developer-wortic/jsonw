# jsonW no nginx (com fcgiwrap para o wjsw-cgi). TODO pedido de .jsw vai para o wjsw-cgi: o nginx nunca entrega o .jsw por
# conta propria, porque quem sabe o que a sessao pode ver e o wjsw-cgi. Arquivo sem coluna marcada e sem tenant sai puro por
# ele, inteiro ou por faixa (Range: 206); o resto sai so com o que a sessao pode ver.
# escopos da sessao: vazio por padrao (nenhum escopo); o auth_request preenche (ver abaixo)
map $uri $jsonw_escopo { default ""; }
server {
    listen 8080;
    root /var/www/html;
    location ~ \.jsw$ {
        rewrite ^ /jsonw-cgi$uri last;
    }
    location ^~ /jsonw-cgi/ {
        internal;
        fastcgi_pass unix:/run/fcgiwrap.socket;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/wjsw-cgi;
        fastcgi_param WJSW_RAIZ $document_root;
        fastcgi_param WJSW_MAX_LINHAS 100000;
        # o que a sessao pode ver, decidido pelo SERVIDOR depois de autenticar (auth_request + auth_request_set $jsonw_escopo
        # $upstream_http_x_jsonw_escopo); nunca copiar um cabecalho do cliente aqui. Sem isto: coluna +pessoal/+escopo(x) nao sai.
        fastcgi_param JSONW_ESCOPO $jsonw_escopo;
        fastcgi_param PATH_INFO "";
        set $jsonw_uri $uri;
        if ($jsonw_uri ~ ^/jsonw-cgi(/.+)$) { set $jsonw_arq $1; }
        fastcgi_param PATH_TRANSLATED $document_root$jsonw_arq;
        fastcgi_buffering off;   # arquivo grande sai em fluxo, sem arquivo temporario no nginx
    }
}
