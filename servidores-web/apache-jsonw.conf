# jsonW no Apache 2.4 (provado no 2.4.66). Precisa de: mod_rewrite, mod_alias, mod_cgi (ou mod_cgid), mod_env.
# TODO pedido de .jsw vai para o wjsw-cgi (bin/<plataforma>/wjsw-cgi), que so le dentro de WJSW_RAIZ. O Apache nunca
# entrega o .jsw por conta propria: quem sabe o que a sessao pode ver e o wjsw-cgi. Arquivo sem coluna marcada e sem tenant
# sai puro por ele, inteiro ou por faixa (Range: 206); com pedido (?formato=json|ndjson, ?onde=, ?campos=, ?limite=) ou
# Accept JSON, ou quando ha coluna +pessoal/+escopo(x) ou tenant, sai so o que a sessao pode ver.
SetEnv WJSW_RAIZ /var/www/html
SetEnv WJSW_MAX_LINHAS 100000
# o que a sessao pode ver, decidido pelo SERVIDOR depois de autenticar (nunca copie um cabecalho do cliente):
#   SetEnv JSONW_ESCOPO "pessoal vendas tenant:42"      ou, por sessao, RewriteRule ... [E=JSONW_ESCOPO:...]
ScriptAlias /jsonw-cgi /usr/local/bin/wjsw-cgi
RewriteEngine on
RewriteCond %{REQUEST_URI} !^/jsonw-cgi/
# NS: a sub-requisicao interna que calcula o PATH_TRANSLATED nao pode ser reescrita (senao o caminho aponta para o CGI)
RewriteRule ^(/.+\.jsw)$ /jsonw-cgi$1 [PT,NS]
